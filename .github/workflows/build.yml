name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          mkdir www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Mushaf" com.mushaf.app --web-dir www
          npx cap add android
          npx cap sync android
          for s in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=android/app/src/main/res/mipmap-${s%%:*}
            convert icon-512.png -resize ${s##*:}x${s##*:} $d/ic_launcher.png
            cp $d/ic_launcher.png $d/ic_launcher_round.png
            cp $d/ic_launcher.png $d/ic_launcher_foreground.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          sed -i 's/>Mushaf</>مصحف</' android/app/src/main/res/values/strings.xml
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mushaf-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
